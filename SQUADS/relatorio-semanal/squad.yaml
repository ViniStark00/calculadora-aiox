name: relatorio-semanal
version: 1.0.0
description: >
  Automatiza 3 atividades semanais do gestor de tráfego:
  coleta de métricas via Reportei API, geração de relatório
  narrativo e publicação na Timeline do Reportei.
  Pipeline multi-cliente — bloco Vinicius na planilha Google Sheets.
author: ViniStark00
license: MIT
slashPrefix: relatorio-semanal

aiox:
  minVersion: "2.1.0"
  type: squad

domain:
  primary: weekly-report-automation
  secondary: [trafego-pago, meta-ads, google-ads, relatorio-cliente]
  multi_client: true
  gestor_block: "Vinicius"

components:
  agents:
    - relatorio-chief.md
    - contexto-cliente.md
    - coletor.md
    - redator.md
    - publicador.md
    - quality-gate.md
    - whatsapp-writer.md
  tasks:
    - fetch-metrics.md
    - verify-fill.md
    - generate-report.md
    - validate-report.md
    - publish-timeline.md
  workflows:
    - weekly-report-pipeline.md
  checklists:
    - qa-relatorio.md
  templates:
    - relatorio-template.md
    - whatsapp-template.md
  data: []
  tools: []
  scripts: []

config:
  extends: extend
  entrypoint: agents/relatorio-chief.md

integrations:
  - name: Reportei API v2
    type: http-rest
    base_url: "https://api.reportei.com/v2"
    auth: bearer-token
    env: REPORTEI_TOKEN
  - name: Google Sheets API
    type: service-account
    env: GOOGLE_SERVICE_ACCOUNT_JSON
    sheet_id_env: SHEET_ID
  - name: MCP Reportei
    id: "mcp__30ebe978-db99-4dee-927c-b72f6abac9d8"
    tools:
      - create_timeline_event
      - get_metrics
      - get_project
      - get_report
      - list_projects
  - name: Google Drive MCP
    id: "mcp__92a31705-b51e-422b-abc2-e6cb82a79330"
    tools:
      - search_files
      - read_file_content
      - create_file
      - download_file_content

pipeline_flow: >
  relatorio-chief → contexto-cliente (leitura) → coletor → quality-gate (verify-fill)
  → redator → quality-gate (validate-report) → publicador → whatsapp-writer
  → contexto-cliente (atualização) → resumo final

dependencies:
  node: []
  python: []
  squads: []

tags:
  - trafego-pago
  - relatorio-semanal
  - google-sheets
  - reportei
  - meta-ads
  - google-ads
  - multi-cliente
  - automacao
