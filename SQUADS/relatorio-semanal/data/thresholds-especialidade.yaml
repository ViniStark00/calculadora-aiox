  # ──────────────────────────────────────────────────────────────────────────
  # ESPECIALIDADE GOOGLE ADS
  # CPL aqui = custo por conversão (não por conversa WhatsApp)
  # Métrica diferente: google_spend / conversoes
  # Referência informada pelo usuário: média desejada R$20–28/conversão
  # ──────────────────────────────────────────────────────────────────────────

  cirurgia_ortognatica:
    # Cirurgia de mandíbula/maxila (Dr. Laureano Filho — só Google Ads)
    # CPL aqui = custo por conversão Google Ads (não custo por conversa WhatsApp)
    # CTR benchmark diferente: Google Search médico = 3–8% (vs 1–2% no Meta)
    cpl:
      saudavel:
        max: 23.00
        descricao: "Custo por conversão dentro do alvo (Google Ads) — referência R$20–23"
      atencao:
        min: 23.00
        max: 30.00
        descricao: "Custo por conversão acima do alvo — monitorar palavras-chave e correspondência"
      critico:
        min: 30.00
        descricao: "Custo por conversão elevado — revisar termos de pesquisa, lances e landing page"
    cpm:
      # Referência Google Display (quando usado); Google Search é CPC-based
      saudavel:
        max: 12.00
      atencao:
        min: 12.00
        max: 25.00
      critico:
        min: 25.00
    ctr:
      # Google Search: CTR saudável é muito maior que Meta Ads
      saudavel:
        min: 4.0
      atencao:
        min: 2.0
        max: 4.0
      critico:
        max: 2.0
    frequencia:
      # Search tem menor necessidade de retargeting intenso
      saudavel:
        max: 2.0
      atencao:
        min: 2.0
        max: 3.5
      critico:
        min: 3.5
