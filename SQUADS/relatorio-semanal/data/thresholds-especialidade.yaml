        max: 35.00
      atencao:
        min: 35.00
        max: 70.00
      critico:
        min: 70.00
    ctr:
      # Público mais seletivo → CTR naturalmente menor que procedimentos isolados
      saudavel:
        min: 1.2
      atencao:
        min: 0.6
        max: 1.2
      critico:
        max: 0.6
    frequencia:
