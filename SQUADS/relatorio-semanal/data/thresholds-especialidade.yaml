# thresholds-especialidade.yaml — Referência de benchmarks por especialidade médica
# Usado pelo redator para classificar métricas e calibrar o tom da narrativa.
# Este arquivo PODE ser commitado — não contém dados de produção.
#
# Níveis: saudavel | atencao | critico
# Regra de interpretação:
#   saudavel → tom neutro ou positivo
#   atencao  → tom neutro com observação
#   critico  → tom neutro com alerta (nunca usar palavras proibidas do CLAUDE.md)
#
# IMPORTANTE: os termos "saudavel", "atencao", "critico" são internos ao agente.
# Nunca expor esses termos no relatório — usar apenas a conclusão em linguagem natural.
#
# NOTA CPL — distinção importante:
#   CPL aqui = custo por conversa WhatsApp no gerenciador de anúncios (Meta Ads)
#              NÃO é CAC (custo de aquisição de cliente/paciente), que é muito maior.
#   Valores baseados na média real da carteira Vinicius (últimos 6 meses, mai/2026).
#   Referência: média histórica R$6–8/conversa, alerta acima de R$10.
#
#   Exceção: cirurgia_ortognatica usa Google Ads (custo por conversão, não por conversa)
#   Referência Google: média desejada R$20–28/conversão.

especialidades:

  # ──────────────────────────────────────────────────────────────────────────
  # ESPECIALIDADES META ADS
  # CPL = meta_spend / conversas (conversas WhatsApp iniciadas)
  # Thresholds uniformes entre especialidades — variações reais são pequenas
  # ──────────────────────────────────────────────────────────────────────────

  cirurgia_plastica:
    cpl:
      # Atualizado em 2026-05-20 com base na média real da carteira (Sessão 17)
      saudavel:
        max: 8.00
        descricao: "CPL dentro da média histórica da carteira"
      atencao:
        min: 8.00
        max: 15.00
        descricao: "CPL acima da média — monitorar evolução e volume investido"
      critico:
        min: 15.00
        descricao: "CPL consistentemente elevado — revisar segmentação e criativos"
    cpm:
      # CPM = custo por mil impressões (R$)
      saudavel:
        max: 30.00
      atencao:
        min: 30.00
        max: 60.00
      critico:
        min: 60.00
    ctr:
      # CTR = taxa de cliques (%) — valor mínimo desejável
      saudavel:
        min: 1.5
      atencao:
        min: 0.8
        max: 1.5
      critico:
        max: 0.8
    frequencia:
      # Frequência = média de vezes que o mesmo usuário viu o anúncio
      saudavel:
        max: 3.0
      atencao:
        min: 3.0
        max: 5.0
      critico:
        min: 5.0

  dermatologia:
    cpl:
      saudavel:
        max: 8.00
        descricao: "CPL dentro da média histórica da carteira"
      atencao:
        min: 8.00
        max: 15.00
        descricao: "CPL acima da média — monitorar evolução e volume investido"
      critico:
        min: 15.00
        descricao: "CPL consistentemente elevado — revisar segmentação e criativos"
    cpm:
      saudavel:
        max: 22.00
      atencao:
        min: 22.00
        max: 45.00
      critico:
        min: 45.00
    ctr:
      saudavel:
        min: 2.0
      atencao:
        min: 1.0
        max: 2.0
      critico:
        max: 1.0
    frequencia:
      saudavel:
        max: 3.0
      atencao:
        min: 3.0
        max: 6.0
      critico:
        min: 6.0

  medicina_estetica:
    cpl:
      saudavel:
        max: 8.00
        descricao: "CPL dentro da média histórica da carteira"
      atencao:
        min: 8.00
        max: 15.00
        descricao: "CPL acima da média — monitorar evolução e volume investido"
      critico:
        min: 15.00
        descricao: "CPL consistentemente elevado — revisar segmentação e criativos"
    cpm:
      saudavel:
        max: 18.00
      atencao:
        min: 18.00
        max: 38.00
      critico:
        min: 38.00
    ctr:
      saudavel:
        min: 2.5
      atencao:
        min: 1.2
        max: 2.5
      critico:
        max: 1.2
    frequencia:
      saudavel:
        max: 3.0
      atencao:
        min: 3.0
        max: 6.0
      critico:
        min: 6.0

  # ──────────────────────────────────────────────────────────────────────────
  # NOVAS ESPECIALIDADES — adicionadas em 2026-05-20 (Plano V2, Etapa 2/3)
