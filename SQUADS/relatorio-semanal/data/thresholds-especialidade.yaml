# thresholds-especialidade.yaml — Referência de benchmarks por especialidade médica
# Usado pelo redator para classificar métricas e calibrar o tom da narrativa.
# Este arquivo PODE ser commitado — não contém dados de produção.
#
# Níveis: saudavel | atencao | critico
# Regra de interpretação:
#   saudavel → tom neutro ou positivo
#   atencao  → tom neutro com observação
#   critico  → tom neutro com alerta (nunca usar palavras proibidas do CLAUDE.md)
#
# IMPORTANTE: os termos "saudavel", "atencao", "critico" são internos ao agente.
# Nunca expor esses termos no relatório — usar apenas a conclusão em linguagem natural.

especialidades:

  cirurgia_plastica:
    cpl:
      # CPL = custo por conversa (lead WhatsApp)
      # Valores definidos pelo usuário (briefing Sessão 14)
      saudavel:
        max: 150.00
        descricao: "CPL dentro do esperado para cirurgia plástica"
      atencao:
        min: 150.00
        max: 300.00
        descricao: "CPL acima do ideal — monitorar evolução"
      critico:
        min: 300.00
        descricao: "CPL elevado para a especialidade — revisar segmentação e criativos"
    cpm:
      # CPM = custo por mil impressões (R$)
      saudavel:
        max: 30.00
      atencao:
        min: 30.00
        max: 60.00
      critico:
        min: 60.00
    ctr:
      # CTR = taxa de cliques (%) — valor mínimo desejável
      saudavel:
        min: 1.5
      atencao:
        min: 0.8
        max: 1.5
      critico:
        max: 0.8
    frequencia:
      # Frequência = média de vezes que o mesmo usuário viu o anúncio
      saudavel:
        max: 3.0
      atencao:
        min: 3.0
        max: 5.0
      critico:
        min: 5.0

  dermatologia:
    cpl:
      # Valores definidos pelo usuário (briefing Sessão 14)
      saudavel:
        max: 80.00
        descricao: "CPL dentro do esperado para dermatologia"
      atencao:
        min: 80.00
        max: 160.00
        descricao: "CPL acima do ideal — monitorar evolução"
      critico:
        min: 160.00
        descricao: "CPL elevado para a especialidade — revisar segmentação e criativos"
    cpm:
      saudavel:
        max: 22.00
      atencao:
        min: 22.00
        max: 45.00
      critico:
        min: 45.00
    ctr:
      saudavel:
        min: 2.0
      atencao:
        min: 1.0
        max: 2.0
      critico:
        max: 1.0
    frequencia:
      saudavel:
        max: 3.0
      atencao:
        min: 3.0
        max: 6.0
      critico:
        min: 6.0

  medicina_estetica:
    cpl:
      # Valores definidos pelo usuário (briefing Sessão 14)
      saudavel:
        max: 60.00
        descricao: "CPL dentro do esperado para medicina estética"
      atencao:
        min: 60.00
        max: 120.00
        descricao: "CPL acima do ideal — monitorar evolução"
      critico:
        min: 120.00
        descricao: "CPL elevado para a especialidade — revisar segmentação e criativos"
    cpm:
      saudavel:
        max: 18.00
      atencao:
        min: 18.00
        max: 38.00
      critico:
        min: 38.00
    ctr:
      saudavel:
        min: 2.5
      atencao:
        min: 1.2
        max: 2.5
      critico:
        max: 1.2
    frequencia:
      saudavel:
        max: 3.0
      atencao:
        min: 3.0
        max: 6.0
      critico:
        min: 6.0
