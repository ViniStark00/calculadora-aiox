  mommy_makeover:
    # Procedimentos combinados pós-gestação (abdominoplastia + mamoplastia + lipo)
    # Público mais nichado — volume menor, frequência tolerada ligeiramente maior
    cpl:
      saudavel:
        max: 8.00
        descricao: "CPL dentro da média histórica da carteira"
      atencao:
        min: 8.00
        max: 15.00
        descricao: "CPL acima da média — monitorar evolução e volume investido"
      critico:
        min: 15.00
        descricao: "CPL consistentemente elevado — revisar segmentação e criativos"
    cpm:
