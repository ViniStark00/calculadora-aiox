# clientes-config.yaml — Configuração por cliente
# NÃO incluir tokens ou credenciais aqui.
# SHEET_ID e REPORTEI_TOKEN devem estar em variáveis de ambiente.

gestor:
  nome: Vinicius
  bloco_planilha: "Vinicius"  # header que delimita o bloco na planilha

planilha:
  # SHEET_ID vem da variável de ambiente SHEET_ID
  # Colunas por métrica (índice 0 = coluna A)
  colunas:
    meta_spend: C      # Meta Ads — Spend (R$)
    google_spend: E    # Google Ads — Spend (R$)
    seguidores: H      # Seguidores Instagram
    conversas: K       # Conversas WhatsApp (leads)
    conversoes: O      # Conversões

reportei:
  api_base: "https://api.reportei.com/v2"
  per_page: 100
  rate_limit_sleep: 0.6    # segundos entre chamadas
  rate_limit_retry: 60     # segundos para aguardar após erro 429

# MANUAL_MAP: chave = nome do projeto no Reportei (lowercase), valor = nome na planilha
# null = ignorar (não é cliente ativo do bloco Vinicius)
manual_map:
  "imcp": "IMCP - Instituto Mineiro de Cirurgia Plastica"
  "destra": "Destra Desenvolvimentos"
  "destra desenvolvimentos": "Destra Desenvolvimentos"
  "igo implantes/mensagens": "IGO"
  "igo implantes": "IGO"
  "dr. alvaro": "Dr. Alvaro Rodrigues"
  "dr. alvaro rodrigues": "Dr. Alvaro Rodrigues"
  "dr. enzo": "Dr. Enzo Carvalho"
  "dr. enzo carvalho": "Dr. Enzo Carvalho"
  "dr javier": "Dr Javier Cucchiaro"
  "dr javier cucchiaro": "Dr Javier Cucchiaro"
  "dr. daniel renno (maxioral)": "MaxiOral"
  "maxioral": "MaxiOral"
  "zanicare  / mensagens": "Zenicare"
  "zanicare": "Zenicare"
  "dra nicolle andrade": "Dra Nicolli"
  "dra nicolli": "Dra Nicolli"
  "dra danielle gondim": "Dra Danielle Gondim"
  "danielle gondim": "Dra Danielle Gondim"
  "dr juan lopez": null       # não é cliente ativo
  "stark marketing": null     # não é cliente ativo
  "dr, matheus ocampo": null  # não é cliente ativo
  "l348": null                # não é cliente ativo

fuzzy_threshold: 0.60  # similaridade mínima para match fuzzy (fallback)

# Exceções por cliente
excecoes:
  skip_meta_spend:
    - "Dr Javier Cucchiaro"  # Meta Spend bloqueado em ARS — pular sem erro

# Slugs de métricas no Reportei (exatos — não alterar)
slugs:
  google_ads: "google_adwords"           # NÃO usar "google_ads"
  seguidores: "ig:new_followers_count"   # match exato
  conversas: "messaging_conversation_started_7d"  # match exato
  google_cost_unit: "direct"             # custo Google = valor direto, SEM ÷ 1.000.000

# Lógica de plataformas (coletor + redator):
# O coletor tenta coletar TODAS as métricas para todos os clientes.
# Se uma plataforma não existir no projeto, o valor volta zerado ou ausente — sem erro.
# O redator verifica o que tem dado e escreve apenas sobre isso:
#   - tem meta_spend > 0  → incluir seção Meta Ads e criativos
#   - tem google_spend > 0 → incluir seção Google Ads e palavras-chave
#   - tem ambos           → incluir as duas seções
# Nenhuma configuração manual de plataforma necessária.
