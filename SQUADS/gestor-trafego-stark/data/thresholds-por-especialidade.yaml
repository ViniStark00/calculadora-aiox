# ──────────────────────────────────────────────────────────────────────────
# B1 — KILL-SWITCH POR ESPECIALIDADE
#
# Gasto de 3 dias consecutivos sem nenhuma conversa → alerta CRÍTICO.
# Aplica-se APENAS a campanhas com 7+ dias de veiculação.
# Severidade: CRÍTICO — notificar gestor, NUNCA pausar automaticamente.
# N/A = cirurgia_ortognatica (Google Ads — métrica diferente, sem kill-switch)
# ──────────────────────────────────────────────────────────────────────────

kill_switch:
  regra: "conversas = 0 em lookback de 3 dias consecutivos, com 7+ dias de veiculação"
  severidade: "CRITICO"
  acao: "notificar gestor — NUNCA pausar automaticamente"
  por_especialidade:
    cirurgia_plastica:
      gasto_3_dias_sem_conversa: 45.00
    cirurgia_facial:
      gasto_3_dias_sem_conversa: 54.00
    cirurgia_corporal:
      gasto_3_dias_sem_conversa: 45.00
    mommy_makeover:
      gasto_3_dias_sem_conversa: 45.00
    cirurgia_trans:
      gasto_3_dias_sem_conversa: 45.00
    medicina_estetica:
      gasto_3_dias_sem_conversa: 30.00
    emagrecimento:
      gasto_3_dias_sem_conversa: 75.00
    ginecologia:
      gasto_3_dias_sem_conversa: 84.00
    cirurgia_bucomaxilofacial:
      gasto_3_dias_sem_conversa: 60.00
    cirurgia_ortognatica:
      gasto_3_dias_sem_conversa: null
      nota: "N/A — Google Ads usa métrica de conversão diferente"
    dermatologia:
      gasto_3_dias_sem_conversa: 50.00
      nota: "Sem clientes ativos em 2026-05-28 — mantido para compatibilidade futura"

# ──────────────────────────────────────────────────────────────────────────
# B2 — FREQUÊNCIA POR TIPO DE CAMPANHA
#
# Substitui o threshold genérico de frequência por thresholds diferenciados.
# Janela: last_7d. Mínimo 1.000 impressões.
# ──────────────────────────────────────────────────────────────────────────

frequencia_por_tipo_campanha:
  janela: "last_7d"
  minimo_impressoes: 1000
  nota: "Abaixo de 1.000 impressões a frequência é estatisticamente instável — não alertar"
  tipos:
    TOFU:
      descricao: "Prospecting — topo de funil"
      prefixos: [TOFU, IMP]
      alerta: 2.5
      pause: 3.0
    MOFU:
      descricao: "Engajamento — meio de funil"
      prefixos: [MOFU, TRAF]
      alerta: 3.0
      pause: 3.5
    BOFU:
      descricao: "Conversão — fundo de funil"
      prefixos: [BOFU, CONV]
      alerta: 4.0
      pause: 4.5
    AWARENESS:
      descricao: "Awareness e alcance"
      prefixos: [AW, REACH]
      alerta: 2.2
      pause: 2.8
    DEFAULT:
      descricao: "Tipo não identificável pelo prefixo — usar TOFU como conservador"
      alerta: 2.5
      pause: 3.0

# ──────────────────────────────────────────────────────────────────────────
# B3 — QUANDO NÃO ALERTAR
#
# Regras de supressão para evitar falso-positivos.
# ──────────────────────────────────────────────────────────────────────────

quando_nao_alertar:
  regras:
    - id: campanha_nova
      condicao: "Campanha com menos de 7 dias de veiculação"
      motivo: "Dados insuficientes para avaliação estatística"
    - id: spend_baixo
      condicao: "Spend < R$20 no lookback de 3 dias"
      motivo: "Volume muito baixo — qualquer variação é ruído, não sinal"
    - id: impressoes_baixas
      condicao: "Impressões < 1.000"
      motivo: "Frequência e CTR estatisticamente instáveis abaixo deste volume"
    - id: awareness_cpm
      condicao: "Campanhas com prefixo AW ou REACH com CPM elevado"
      motivo: "CPM alto é esperado em campanhas de awareness — não é alerta"
    - id: laureano_meta
      condicao: "Cliente Dr. Laureano Filho — excluir_meta_monitoring: true"
      motivo: "Dr. Laureano opera exclusivamente Google Ads — ignorar monitoramento Meta completamente"
