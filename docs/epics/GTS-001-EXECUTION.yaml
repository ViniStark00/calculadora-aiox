---
# EPIC GTS-001 — Criação do Squad gestor-trafego-stark
# Gerado na Etapa 2 por @pm (Morgan)
# Referência arquitetural: squads/gestor-trafego-stark/DESIGN.md

epic:
  id: GTS-001
  title: "Squad gestor-trafego-stark — Criação e Implementação"
  squad: gestor-trafego-stark
  version: "1.0"
  status: in_progress
  created_at: "2026-05-28"
  owner: gustavoradler-cybe

  description: |
    Criar do zero o squad `gestor-trafego-stark`, unificando o melhor de dois squads
    existentes (gestor-trafego-vinicius e gestor-trafego-gustavo) em um squad único
    que automatiza as 4 rotinas operacionais de gestão de tráfego pago médico da Stark Marketing.

    Gestores atendidos: Vinicius Lima e Gustavo Radler.
    Carteira total: ~30 clientes (19 Vinicius + 11 Gustavo, 2 compartilhados).

  problema: |
    Atualmente existem dois squads separados com lógica duplicada e incompleta:
    - gestor-trafego-vinicius: cobre relatório semanal mas não monitora Meta Ads diretamente
    - gestor-trafego-gustavo: cobre monitoramento e ClickUp mas sem pipeline de relatório completo
    Nenhum dos dois cobre todas as 4 rotinas de forma integrada.

  objetivo: |
    Um único squad que execute as 4 rotinas sem duplicação de chamadas API,
    com dados compartilhados entre fases do pipeline e quality gates em cada saída.

  rotinas_automatizadas:
    - id: R1
      nome: Monitoramento de contas
      frequencia: diaria
      agente_responsavel: alerta-monitor
      output: "Painel de alertas 🔴🟡ℹ️ classificados por especialidade médica"
    - id: R2
      nome: Preenchimento de planilha Google Sheets
      frequencia: semanal
      agente_responsavel: coletor
      output: "Colunas meta_spend/google_spend/seguidores/conversas/conversoes preenchidas"
      restricao: "Somente clientes onde vinicius in gestores[]"
    - id: R3
      nome: Relatório Reportei
      frequencia: semanal
      agente_responsavel: redator + publicador
      output: "Narrativa markdown + HTML timeline + marco publicado no Reportei"
    - id: R4
      nome: Status Report ClickUp
      frequencia: semanal
      agente_responsavel: clickup-writer
      output: "Narrativa de ações da semana escrita no doc ClickUp do gestor"

  constraints:
    - "Squads originais (vinicius e gustavo) NÃO devem ser modificados"
    - "Todos os agentes/tasks são escritos do zero — nenhum arquivo copiado"
    - "Campanhas no Meta Ads: apenas leitura — nunca ações"
    - "Status de criação de objetos (campanhas, etc.): sempre PAUSED"
    - "Tokens e credenciais nunca expostos em outputs"

  architecture_reference: "squads/gestor-trafego-stark/DESIGN.md"

---

