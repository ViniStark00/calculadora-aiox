<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Científica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- ═══════════════════════════════════════════
         CALCULADORA
    ═══════════════════════════════════════════ -->
    <section class="calculator">

      <!-- Display: expressão em construção + resultado -->
      <div class="display">
        <div class="expression" id="expression" aria-label="Expressão">0</div>
        <div class="result"     id="result"     aria-label="Resultado"></div>
      </div>

      <!-- Toggles de modo -->
      <div class="mode-toggles">
        <button id="toggle-mode"  data-mode="basic"  class="toggle-btn">Científico</button>
        <button id="toggle-angle" data-angle="deg"   class="toggle-btn toggle-active">DEG</button>
      </div>

      <!-- Grade de botões -->
      <div class="keypad" id="keypad">

        <!-- Botões científicos (ocultos no modo básico) -->
        <div class="scientific-buttons">
          <button data-action="append" data-value="sin("   >sin</button>
          <button data-action="append" data-value="cos("   >cos</button>
          <button data-action="append" data-value="tan("   >tan</button>
          <button data-action="append" data-value="asin("  >sin⁻¹</button>
          <button data-action="append" data-value="acos("  >cos⁻¹</button>
          <button data-action="append" data-value="atan("  >tan⁻¹</button>

          <button data-action="append" data-value="ln("    >ln</button>
          <button data-action="append" data-value="log("   >log</button>
          <button data-action="append" data-value="^2"     >x²</button>
          <button data-action="append" data-value="^"      >xⁿ</button>
          <button data-action="append" data-value="sqrt("  >√</button>
          <button data-action="append" data-value="abs("   >|x|</button>

          <button data-action="append" data-value="fact("  >n!</button>
          <button data-action="append" data-value="PI"     >π</button>
          <button data-action="append" data-value="E"      >e</button>
        </div>

        <!-- Botões básicos (sempre visíveis) -->
        <div class="basic-buttons">
          <button data-action="clear"                   class="btn-action"  >C</button>
          <button data-action="backspace"               class="btn-action"  >CE</button>
          <button data-action="append" data-value="%"   class="btn-action"  >%</button>
          <button data-action="append" data-value="("   class="btn-action"  >()</button>

          <button data-action="append" data-value="7">7</button>
          <button data-action="append" data-value="8">8</button>
          <button data-action="append" data-value="9">9</button>
          <button data-action="append" data-value="/" class="btn-operator">÷</button>

          <button data-action="append" data-value="4">4</button>
          <button data-action="append" data-value="5">5</button>
          <button data-action="append" data-value="6">6</button>
          <button data-action="append" data-value="*" class="btn-operator">×</button>

          <button data-action="append" data-value="1">1</button>
          <button data-action="append" data-value="2">2</button>
          <button data-action="append" data-value="3">3</button>
          <button data-action="append" data-value="-" class="btn-operator">−</button>

          <button data-action="append" data-value="0" class="btn-zero">0</button>
          <button data-action="append" data-value=".">.</button>
          <button data-action="calculate"              class="btn-equals"  >=</button>
          <button data-action="append" data-value="+" class="btn-operator">+</button>
        </div>

      </div><!-- /keypad -->
    </section><!-- /calculator -->

    <!-- ═══════════════════════════════════════════
         HISTÓRICO
    ═══════════════════════════════════════════ -->
    <section class="history-panel">
      <div class="history-header">
        <span class="history-title">Histórico</span>
        <button id="btn-clear-history" data-action="clear-history">Limpar</button>
      </div>
      <div class="history-list" id="history-list">
        <!-- Itens adicionados pelo JS -->
        <div class="history-empty">Nenhum cálculo ainda</div>
      </div>
    </section>

  </div><!-- /app -->

  <script src="script.js"></script>
</body>
</html>
