# thresholds-por-especialidade.yaml — Benchmarks por especialidade médica
# Squad: gestor-trafego-stark
# Origem: fusão de gestor-trafego-vinicius + gestor-trafego-gustavo (ADR-06)
# ADR-06: quando valores conflitam entre squads, adotar o mais conservador (mais restritivo).
# Este arquivo PODE ser commitado — não contém dados de produção.
#
# Níveis: saudavel | atencao | critico
# Regra de interpretação:
#   saudavel → tom neutro ou positivo
#   atencao  → tom neutro com observação
#   critico  → tom neutro com alerta (nunca usar palavras proibidas do CLAUDE.md)
#
# IMPORTANTE: os termos "saudavel", "atencao", "critico" são internos ao agente.
# Nunca expor esses termos no relatório — usar apenas a conclusão em linguagem natural.
#
# NOTA CPL — distinção importante:
#   CPL aqui = custo por conversa WhatsApp no gerenciador de anúncios (Meta Ads)
#              NÃO é CAC (custo de aquisição de cliente/paciente)
#   Valores baseados na média real da carteira Vinicius (últimos 6 meses, mai/2026)
#   Referência: média histórica R$6–8/conversa, alerta acima de R$10
#
#   Exceção: cirurgia_ortognatica usa Google Ads (custo por conversão, não por conversa)
#
#   Novos no stark (Gustavo): saude_geral, oncologia, tricologia

