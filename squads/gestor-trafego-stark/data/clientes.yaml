# meta_ad_account_id: preenchido via MCP na Sessão 9 (2026-06-10); null = fallback Reportei
# sheet_columns: todos os clientes ativos dos 8 gestores usam *sheet_cols (FASE 2 multi-gestor)
# clickup_status_list_id: apenas clientes Gustavo; null = preencher antes do primeiro uso
# Especialidades corrigidas em 2026-05-28 via cruzamento com docs "Contexto Clientes - Stark" no Drive

