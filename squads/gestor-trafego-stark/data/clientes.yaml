  seguidores: F         # Reportei instagram_business: new_followers_count
  conversas_whats: K    # Reportei facebook_ads: messaging_conversation_started_7d
  leads_meta: M         # Reportei facebook_ads: actions_lead
  leads_respondi: N     # Leads Respondi (via metricas_coletadas ou Reportei)
