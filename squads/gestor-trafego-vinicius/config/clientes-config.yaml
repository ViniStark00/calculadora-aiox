# clientes-config.yaml — Configuração por cliente
# NÃO incluir tokens ou credenciais aqui.
# SHEET_ID e REPORTEI_TOKEN devem estar em variáveis de ambiente.

gestor:
  nome: Vinicius
  bloco_planilha: "Vinicius"  # header que delimita o bloco na planilha

planilha:
  # SHEET_ID vem da variável de ambiente SHEET_ID
  # IMPORTANTE: abas nomeadas pelo DOMINGO da semana (ex: 17/05/2026 = semana 11-17/05)
  # Nomes curtos na coluna A (ex: 'IMCP', 'DESTRA', 'Dra Danielle Gondim')
  # Colunas por métrica (índice 0 = coluna A)
  colunas:
    meta_spend: C      # Meta Ads — Spend (R$)
    google_spend: E    # Google Ads — Spend (R$)
    seguidores: H      # Seguidores Instagram
    conversas: K       # Conversas WhatsApp (leads)
    conversoes: O      # Conversões

reportei:
  api_base: "https://api.reportei.com/v2"
  per_page: 100
  rate_limit_sleep: 0.6    # segundos entre chamadas
  rate_limit_retry: 60     # segundos para aguardar após erro 429

# project_ids: mapeamento direto nome_planilha → ID do projeto no Reportei
# PLANO B: a API GET /v2/projects retorna só 4 projetos com o token do Vinicius (Admin).
# Solução: chamar GET /v2/projects/{ID} diretamente, bypassing a listagem.
# Para adicionar ID de um novo cliente: abrir Reportei → clicar no cliente → ver número na URL.
