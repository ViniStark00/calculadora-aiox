# Especialidade médica por cliente
# Valores permitidos (slugs exatos das chaves em thresholds-especialidade.yaml):
#   cirurgia_plastica | cirurgia_facial | cirurgia_corporal | mommy_makeover |
#   cirurgia_trans | cirurgia_ortognatica | dermatologia | medicina_estetica | null
# null = sem threshold — redator usa apenas os dados brutos, sem classificação
# Usado pelo redator para classificar métricas via data/thresholds-especialidade.yaml
especialidade_por_cliente:
  # --- Bloco Vinicius — clientes ativos (confirmados em 2026-05-20) ---
  "IMCP - Instituto Mineiro de Cirurgia Plastica": cirurgia_plastica   # geral
  "Dra Danielle Gondim":                           cirurgia_facial      # rinoplastia, blefaroplastia, face
  "Dr. Leandro Gontijio":                          cirurgia_corporal    # silicone, lipo, contorno corporal
  "Dr. Guilherme Mattar":                          cirurgia_trans       # mastectomia afirmativa (trans masc)
  "Dr. Luiz Borba":                                mommy_makeover       # corporal pós-gestação
  "Dr. Lucas Consentino":                          cirurgia_corporal    # corporal geral
  "Dr. Humberto":                                  mommy_makeover       # pós-gestação
  "Dr. Laureano Filho":                            cirurgia_ortognatica # só Google Ads
  "Dr. Diego Gonzalez Salvador":                   mommy_makeover       # pós-gestação
  "Dr. Joel Abdala":                               cirurgia_facial      # facial
  "Dr. Matheus Ocampo":                            cirurgia_corporal    # corporal
